<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>"Hello {{name}}"</h1>
    <a href="/logout">Logout</a>
    <br>
    <br>
    <button><a href="/switch">Switch Account</a></button>
    <!-- <button><a href="/merchant/accounts">SEE ACCOUNTS</a></button> -->
    <br>
    <br>
    <span>{{message}}</span>
    
    <form method="POST" action="/merchant/accounts">
        <label>Select Account:</label>
        <select name="account_id">
            <option value="">-- Select Account --</option>
            {% for account in responses %}
                <option value="{{ account.accountId }}">
                    {{ account.accountName }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Show Details</button>
    </form>

    {% if selected_account %}
        <h3>Account Details</h3>
        <strong>Account Name:</strong> {{ selected_account.accountName }} <br>
        <strong>Account Id:</strong> {{ selected_account.accountId }}
    {% endif %}
</body>
</html>
