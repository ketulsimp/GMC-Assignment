services:
  flask_app:
    build: .
    ports:
      - "5000:5000"
    networks:
      - google-auth
    env_file:
      - .env
    depends_on:
      - mongodb
    

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - google-auth
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

networks:
  google-auth: