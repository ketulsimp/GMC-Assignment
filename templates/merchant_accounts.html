<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchant Accounts</title>
</head>
<body>

    <h2>Merchant Accounts</h2>

    <a href="/merchant/change-account"><button>Change Google Account</button></a>

    <br><br>

    <div id="loading">Loading...</div>

    <div id="content" style="display:none;">

        {% if error %}
            <p>Error: {{ error }}</p>

        {% elif accounts %}

            <select id="merchant-select" onchange="showAccount(this.value)">
                <option value="">-- Select a Merchant --</option>
                {% for account in accounts %}
                    <option value="{{ account.merchant_id }}">
                        {{ account.merchant_name }} (ID: {{ account.merchant_id }})
                    </option>
                {% endfor %}
            </select>

            <br><br>

            <div id="account-detail"></div>

            <script>
                var accounts = {{ accounts | tojson }};

                function showAccount(merchant_id) {
                    var detail = document.getElementById("account-detail");
                    if (!merchant_id) {
                        detail.innerHTML = "";
                        return;
                    }
                    var account = accounts.find(function(a) { return a.merchant_id === merchant_id; });
                    if (!account) {
                        detail.innerHTML = "<p>Account not found.</p>";
                        return;
                    }
                    detail.innerHTML =
                        "<table border='1' cellpadding='8' cellspacing='0'>" +
                        "<thead><tr><th>Merchant ID</th><th>Merchant Name</th><th>User ID</th><th>Google Account</th></tr></thead>" +
                        "<tbody><tr>" +
                        "<td>" + account.merchant_id + "</td>" +
                        "<td>" + account.merchant_name + "</td>" +
                        "<td>" + account.user_id + "</td>" +
                        "<td>" + account.google_account_selected + "</td>" +
                        "</tr></tbody></table>";
                }
            </script>

        {% else %}
            <p>No merchant accounts found.</p>
        {% endif %}

    </div>

    <br>
    <a href="/profile">Back to Profile</a>

    <script>
        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";
    </script>

</body>
</html>
