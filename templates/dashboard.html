<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<a href="http://127.0.0.1:8000/auth/google" style="
      display: inline-block;
      padding: 10px 20px;
      background-color: #4285F4;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial;
    ">
      switch account
</a>

<h2>Select Merchant Account</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

{% if accounts %}
    <form method="post" action="/selected_account">
    <select name="accountId">
        {% for acc in accounts %}
            <option value="{{ acc.accountId }}">
                {{ acc.accountName }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Select</button>
</form>
{% else %}
    <p>No accounts available</p>
{% endif %}


{% if selected_account %}
    <h3>Selected account: {{ selected_account.accountName }}</h3>
    <h3>selected id : {{ selected_account.accountId }}
{% endif %}

</body>
</html>
